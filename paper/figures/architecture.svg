<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- ==================== 1. CONTROL & EXECUTION PLANE (TOP) ==================== -->
  <rect x="25" y="16" width="770" height="92" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
  <text x="40" y="36" font-size="12" font-weight="600" fill="#334155" letter-spacing="0.5">控制与执行面 (Control &amp; Execution Plane)</text>

  <!-- Node A: Laptop -->
  <rect x="45" y="46" width="270" height="50" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="58" y="66" font-size="12" font-weight="600" fill="#1e40af">执行节点 A: 笔记本 (Initiator Client)</text>
  <text x="58" y="84" font-size="11" fill="#64748b">执行阶段 1-2 诊断 • 触发挂起并释放锁</text>

  <!-- Node B: Desktop -->
  <rect x="505" y="46" width="270" height="50" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
  <text x="518" y="66" font-size="12" font-weight="600" fill="#166534">执行节点 B: 台式机 (Successor Client)</text>
  <text x="518" y="84" font-size="11" fill="#64748b">解析便签断点 • 接力执行阶段 3-5 热修</text>


  <!-- ==================== 2. COGNITIVE STATE PLANE (MIDDLE HUB) ==================== -->
  <rect x="25" y="132" width="770" height="150" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" />
  <text x="40" y="152" font-size="12" font-weight="600" fill="#27272a" letter-spacing="0.5">认知与状态面 (Cognitive State Plane) - 统一状态中继 (Relay)</text>

  <!-- Box 1: Cognitive Context -->
  <rect x="45" y="164" width="230" height="104" rx="3" fill="#ffffff" stroke="#a1a1aa" stroke-width="1" />
  <rect x="45" y="164" width="230" height="24" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1" />
  <text x="58" y="180" font-size="11" font-weight="600" fill="#18181b">认知上下文 (Cognitive Context)</text>
  <text x="58" y="204" font-size="11" fill="#52525b">• 任务目标规范 (Goal Specification)</text>
  <text x="58" y="224" font-size="11" fill="#52525b">• 多步规划图 (Execution Plan DAG)</text>
  <text x="58" y="244" font-size="11" fill="#52525b">• 结构化工作记忆 (Working Memory)</text>

  <!-- Box 2: Handover Digest -->
  <rect x="295" y="164" width="230" height="104" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <rect x="295" y="164" width="230" height="24" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
  <text x="308" y="180" font-size="11" font-weight="600" fill="#1e40af">交接摘要便签 (Handover Digest)</text>
  <text x="308" y="204" font-size="11" fill="#334155">• 因果诊断结论 (Verified Findings)</text>
  <text x="308" y="224" font-size="11" fill="#334155">• 当前未决假设 (Active Hypothesis)</text>
  <text x="308" y="244" font-size="11" fill="#334155">• 接管操作建议 (Next Directives)</text>

  <!-- Box 3: Runtime Checkpoint -->
  <rect x="545" y="164" width="230" height="104" rx="3" fill="#ffffff" stroke="#a1a1aa" stroke-width="1" />
  <rect x="545" y="164" width="230" height="24" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1" />
  <text x="558" y="180" font-size="11" font-weight="600" fill="#18181b">运行时检查点 (Runtime Checkpoint)</text>
  <text x="558" y="204" font-size="11" fill="#52525b">• 步骤游标断点 (Step Cursor: 2/5)</text>
  <text x="558" y="224" font-size="11" fill="#52525b">• 上下文局部变量 (Variables Store)</text>
  <text x="558" y="244" font-size="11" fill="#52525b">• 分布式排他租约锁 (TTL Lease Lock)</text>


  <!-- ==================== 3. TARGET ENVIRONMENT PLANE (BOTTOM) ==================== -->
  <rect x="25" y="306" width="770" height="78" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
  <text x="40" y="324" font-size="12" font-weight="600" fill="#334155" letter-spacing="0.5">目标与环境面 (Target Environment Plane)</text>

  <!-- Remote Target Box -->
  <rect x="180" y="334" width="460" height="40" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="410" y="352" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">远程解耦基础设施 (Remote Linux VPS / Cloud Workload)</text>
  <text x="410" y="367" font-size="11" fill="#64748b" text-anchor="middle">Nginx 1.24 故障现场 • PHP-FPM 进程池 • 系统日志追踪</text>


  <!-- ==================== ORTHOGONAL CONNECTORS (CLEAN & NON-OVERLAPPING) ==================== -->
  <!-- 1. Node A Handoff Downward Arrow -->
  <line x1="200" y1="96" x2="200" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="206" y="118" font-size="10" font-weight="600" fill="#2563eb">状态切片序列化 (Suspend &amp; Snapshot)</text>

  <!-- 2. Node B Resume Upward Arrow -->
  <line x1="620" y1="130" x2="620" y2="98" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="470" y="118" font-size="10" font-weight="600" fill="#16a34a">状态恢复与断点接管 (Hydrate &amp; Resume)</text>

  <!-- 3. Node A SSH Session Line (Outer Left Path, 0 overlap) -->
  <path d="M 45 71 L 10 71 L 10 354 L 178 354" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow-gray)" />
  <text x="14" y="346" font-size="10" fill="#475569">阶段 1-2 SSH 远程诊断</text>

  <!-- 4. Node B SSH Session Line (Outer Right Path, 0 overlap) -->
  <path d="M 775 71 L 810 71 L 810 354 L 642 354" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow-gray)" />
  <text x="696" y="346" font-size="10" fill="#475569" text-anchor="start">阶段 3-5 SSH 动态重建</text>

</svg>
