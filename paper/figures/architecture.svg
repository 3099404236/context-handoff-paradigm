<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- ==================== 1. EXECUTION WORKERS (TOP) ==================== -->
  <rect x="20" y="16" width="720" height="78" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <text x="32" y="32" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">EXECUTION AGENTS</text>

  <!-- Initiator Agent -->
  <g transform="translate(45, 36)">
    <rect x="0" y="0" width="225" height="46" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <!-- Laptop Vector Icon -->
    <g transform="translate(12, 11)" stroke="#2563eb" stroke-width="1.4" fill="none">
      <rect x="2" y="2" width="18" height="13" rx="1.5" />
      <line x1="0" y1="19" x2="22" y2="19" stroke-linecap="round" stroke-width="2" />
    </g>
    <text x="44" y="22" font-size="12" font-weight="700" fill="#1e3a8a">Initiator Agent</text>
    <text x="44" y="37" font-size="11" fill="#64748b">Laptop Client (Transient)</text>
  </g>

  <!-- Successor Agent -->
  <g transform="translate(490, 36)">
    <rect x="0" y="0" width="225" height="46" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
    <!-- Workstation Vector Icon -->
    <g transform="translate(12, 11)" stroke="#16a34a" stroke-width="1.4" fill="none">
      <rect x="2" y="2" width="16" height="12" rx="1" />
      <line x1="10" y1="14" x2="10" y2="18" />
      <line x1="5" y1="18" x2="15" y2="18" stroke-linecap="round" stroke-width="1.8" />
      <rect x="20" y="3" width="5" height="15" rx="0.8" />
    </g>
    <text x="44" y="22" font-size="12" font-weight="700" fill="#14532d">Successor Agent</text>
    <text x="44" y="37" font-size="11" fill="#64748b">Workstation Client (Persistent)</text>
  </g>


  <!-- ==================== 2. CONTEXT RELAY SERVICE (MIDDLE) ==================== -->
  <rect x="20" y="118" width="720" height="118" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1" />
  <text x="32" y="136" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.6">CONTEXT RELAY SERVICE</text>

  <!-- Component 1: Working Memory Store -->
  <g transform="translate(45, 146)">
    <rect x="0" y="0" width="205" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <g transform="translate(12, 10)" stroke="#0284c7" stroke-width="1.3" fill="none">
      <rect x="2" y="3" width="16" height="14" rx="1" />
      <line x1="5" y1="7" x2="15" y2="7" />
      <line x1="5" y1="11" x2="12" y2="11" />
    </g>
    <text x="36" y="22" font-size="12" font-weight="700" fill="#0f172a">Memory Store</text>
    <text x="12" y="44" font-size="11" fill="#475569">• Task Plan &amp; DAG</text>
    <text x="12" y="61" font-size="11" fill="#475569">• Inferred Fact Store</text>
  </g>

  <!-- Component 2: Handover Digest -->
  <g transform="translate(278, 146)">
    <rect x="0" y="0" width="205" height="76" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
    <g transform="translate(12, 10)" stroke="#2563eb" stroke-width="1.3" fill="none">
      <path d="M 3 3 H 13 L 17 7 V 17 H 3 Z" />
      <line x1="6" y1="10" x2="12" y2="10" />
      <line x1="6" y1="13" x2="14" y2="13" />
    </g>
    <text x="36" y="22" font-size="12" font-weight="700" fill="#1d4ed8">Handover Digest</text>
    <text x="12" y="44" font-size="11" fill="#1e40af">• Cause Synthesis</text>
    <text x="12" y="61" font-size="11" fill="#1e40af">• Next Action Directives</text>
  </g>

  <!-- Component 3: Lease Coordinator -->
  <g transform="translate(510, 146)">
    <rect x="0" y="0" width="205" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <g transform="translate(12, 10)" stroke="#059669" stroke-width="1.3" fill="none">
      <rect x="3" y="8" width="14" height="11" rx="1.5" />
      <path d="M 6 8 V 4 C 6 2, 14 2, 14 4 V 8" />
    </g>
    <text x="36" y="22" font-size="12" font-weight="700" fill="#0f172a">Lease Coordinator</text>
    <text x="12" y="44" font-size="11" fill="#475569">• Step Checkpoint</text>
    <text x="12" y="61" font-size="11" fill="#475569">• Mutual-Exclusion Lock</text>
  </g>


  <!-- ==================== 3. TARGET ENVIRONMENT (BOTTOM) ==================== -->
  <g transform="translate(20, 260)">
    <rect x="0" y="0" width="720" height="72" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
    <text x="12" y="18" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">TARGET ENVIRONMENT</text>

    <rect x="170" y="24" width="380" height="36" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
    <g transform="translate(182, 31)" stroke="#475569" stroke-width="1.3" fill="none">
      <rect x="2" y="3" width="18" height="16" rx="1.5" />
      <line x1="2" y1="8" x2="20" y2="8" />
      <circle cx="5" cy="5.5" r="0.8" fill="#475569" />
      <circle cx="8" cy="5.5" r="0.8" fill="#475569" />
    </g>
    <text x="210" y="46" font-size="12" font-weight="600" fill="#1e293b">Target VPS Infrastructure (Remote Linux Host)</text>
  </g>


  <!-- ==================== PROTOCOL FLOWS ==================== -->
  <!-- 1. Handoff Flow -->
  <line x1="158" y1="82" x2="158" y2="116" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)" />
  <text x="166" y="103" font-size="10" font-weight="600" fill="#1d4ed8">Snapshot &amp; Relinquish Lock</text>

  <!-- 2. Resume Flow -->
  <line x1="602" y1="116" x2="602" y2="84" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)" />
  <text x="462" y="103" font-size="10" font-weight="600" fill="#15803d">Acquire Lock &amp; Restore State</text>

  <!-- 3. Initiator SSH Route -->
  <path d="M 45 59 L 8 59 L 8 296 L 168 296" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arr-gray)" />
  <text x="14" y="287" font-size="10" fill="#64748b">Diagnosis Phase (SSH)</text>

  <!-- 4. Successor SSH Route -->
  <path d="M 715 59 L 752 59 L 752 296 L 552 296" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arr-gray)" />
  <text x="618" y="287" font-size="10" fill="#64748b" text-anchor="start">Remediation Phase (SSH)</text>

</svg>
