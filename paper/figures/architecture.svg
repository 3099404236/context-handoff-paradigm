<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%" style="background:#ffffff; font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- ==================== LAYER 1: CONTROL & EXECUTION PLANE ==================== -->
  <rect x="30" y="20" width="780" height="105" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5" />
  <text x="45" y="42" font-size="13" font-weight="bold" fill="#334155">【控制与执行面 (Control &amp; Execution Plane)】</text>

  <!-- Node A: Laptop Worker -->
  <rect x="50" y="52" width="260" height="60" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)" />
  <circle cx="70" cy="72" r="8" fill="#0284c7" />
  <text x="70" y="76" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <text x="86" y="75" font-size="13" font-weight="bold" fill="#0369a1">发起端: 笔记本 Worker</text>
  <text x="86" y="96" font-size="11" fill="#64748b">执行阶段 1-2 • 触发挂起并释放锁</text>

  <!-- Node B: Desktop Worker -->
  <rect x="530" y="52" width="260" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#card-shadow)" />
  <circle cx="550" cy="72" r="8" fill="#16a34a" />
  <text x="550" y="76" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <text x="566" y="75" font-size="13" font-weight="bold" fill="#15803d">接管端: 台式机 Worker</text>
  <text x="566" y="96" font-size="11" fill="#64748b">解析便签断点 • 接力完成阶段 3-5</text>


  <!-- ==================== LAYER 2: COGNITIVE STATE PLANE ==================== -->
  <rect x="30" y="150" width="780" height="135" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="45" y="172" font-size="13" font-weight="bold" fill="#92400e">【认知与状态面 (Cognitive State Plane) - 统一状态中继 (Relay)】</text>

  <!-- Sub-block 1: Cognitive State -->
  <rect x="50" y="184" width="225" height="88" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2" />
  <text x="62" y="206" font-size="12" font-weight="bold" fill="#78350f">认知图景 (Cognitive State)</text>
  <text x="62" y="228" font-size="11" fill="#475569">• 顶层意图目标 (Goal)</text>
  <text x="62" y="246" font-size="11" fill="#475569">• 5 阶段规划树 (Plan DAG)</text>
  <text x="62" y="264" font-size="11" fill="#475569">• 工作记忆事实 (Memory Facts)</text>

  <!-- Sub-block 2: Handover Note -->
  <rect x="290" y="184" width="260" height="88" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text x="302" y="206" font-size="12" font-weight="bold" fill="#b45309">语义交接便签 (Handover Note)</text>
  <text x="302" y="228" font-size="11" fill="#0369a1">• 已确诊根因: PHP-FPM OOM-Killed</text>
  <text x="302" y="246" font-size="11" fill="#b45309">• 阻塞点断点: 第 3 步热修准备</text>
  <text x="302" y="264" font-size="11" fill="#15803d">• 建议下一步: 下调 pm.max_children</text>

  <!-- Sub-block 3: Runtime Checkpoint -->
  <rect x="565" y="184" width="225" height="88" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2" />
  <text x="577" y="206" font-size="12" font-weight="bold" fill="#78350f">运行检查点 (Checkpoint)</text>
  <text x="577" y="228" font-size="11" fill="#475569">• 游标索引: Step Index = 2</text>
  <text x="577" y="246" font-size="11" fill="#475569">• 局部变量表: port=9000, pid...</text>
  <text x="577" y="264" font-size="11" fill="#475569">• 分布式排他租约锁 (TTL Lock)</text>


  <!-- ==================== LAYER 3: TARGET ENVIRONMENT PLANE ==================== -->
  <rect x="30" y="310" width="780" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5" />
  <text x="45" y="332" font-size="13" font-weight="bold" fill="#334155">【目标与环境面 (Target Environment Plane) - 远程解耦基础设施】</text>

  <!-- VPS Box -->
  <rect x="180" y="344" width="480" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="420" y="366" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">生产环境 Linux VPS (vps-prod-01: 185.199.108.153)</text>
  <text x="420" y="385" font-size="11" fill="#64748b" text-anchor="middle">运行负载: Nginx 1.24 (502 Bad Gateway) • PHP-FPM 进程池 • 系统日志</text>


  <!-- ==================== INTERACTION FLOWS & LABELS ==================== -->
  <!-- 1. Laptop Handoff to State Plane (Down Arrow) -->
  <path d="M 180 112 L 180 180" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="190" y="125" width="135" height="20" rx="4" fill="#e0f2fe" />
  <text x="195" y="139" font-size="11" font-weight="bold" fill="#0369a1">① 一键挂起 (Handoff)</text>

  <!-- 2. State Plane to Desktop Resume (Up Arrow) -->
  <path d="M 660 180 L 660 116" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="520" y="125" width="135" height="20" rx="4" fill="#dcfce7" />
  <text x="525" y="139" font-size="11" font-weight="bold" fill="#15803d">② 一键接管 (Resume)</text>

  <!-- 3. Laptop -> Target VPS (Left Route) -->
  <path d="M 100 112 L 100 370 L 175 370" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <rect x="20" y="360" width="75" height="18" rx="3" fill="#e0f2fe" />
  <text x="24" y="373" font-size="10" font-weight="bold" fill="#0369a1">阶段1-2排障</text>

  <!-- 4. Desktop -> Target VPS (Right Route) -->
  <path d="M 740 112 L 740 370 L 665 370" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />
  <rect x="745" y="360" width="75" height="18" rx="3" fill="#dcfce7" />
  <text x="749" y="373" font-size="10" font-weight="bold" fill="#15803d">阶段3-5热修</text>

</svg>
